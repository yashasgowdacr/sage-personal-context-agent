services:
  # 1. Public SAGE Web Command Center & API Service
  - type: web
    name: sage-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix apps/web install && npm --prefix apps/web run build && npm --prefix apps/api install && npm --prefix apps/api run build
    startCommand: cd apps/api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: EMBEDDING_SERVICE_HOST
        fromService:
          type: web
          name: sage-embeddings
          property: host
      - key: EMBEDDING_SERVICE_PORT
        fromService:
          type: web
          name: sage-embeddings
          property: port
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SAGE_TOOL_API_KEY
        sync: false
      - key: SAGE_SESSION_SECRET
        sync: false
      - key: SAGE_USER_EMAIL
        sync: false
      - key: SAGE_USER_PASSWORD
        sync: false
      - key: WEB_ORIGIN
        value: https://sage-personal-context-agent.onrender.com

  # 2. FastEmbed Embedding Microservice (BAAI/bge-small-en-v1.5)
  - type: web
    name: sage-embeddings
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r services/embeddings/requirements.txt
    startCommand: cd services/embeddings && python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
